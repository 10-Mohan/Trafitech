
# =============================================
# TraffiTech — GitHub Actions CI/CD Pipeline
# =============================================
# Triggers: Push to main and pull requests targeting main
# Jobs: lint -> test-frontend + test-backend -> build

name: TraffiTech CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =============================================
  # Job 1: Code Linting & Formatting
  # =============================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check


  # =============================================
  # Job 2: Frontend Tests (Vitest)
  # =============================================
  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7


  # =============================================
  # Job 3: Backend Tests (Jest)
  # =============================================
  test-backend:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test
        env:
          NODE_ENV: test


  # =============================================
  # Job 4: Production Build Verification
  # =============================================
  build:
    name: Verify Production Build
    runs-on: ubuntu-latest
    needs:
      - test-frontend
      - test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create dummy environment variables for CI
        run: |
          echo "VITE_STRIPE_PUBLISHABLE_KEY=pk_test_dummy_key_for_ci" > .env
          echo "VITE_API_URL=http://localhost:5000" >> .env

      - name: Run Vite production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
